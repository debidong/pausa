name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Check strings, Info.plist & resources
        run: |
          python3 scripts/check-strings.py
          plutil -lint App/Info.plist
          python3 - <<'PY'
          import json, plistlib, sys
          with open("App/Info.plist", "rb") as fh:
              plist = plistlib.load(fh)
          want = {"zh-Hans", "zh-Hant", "en", "es", "ru", "fr", "vi", "th"}
          got = set(plist.get("CFBundleLocalizations", []))
          if got != want:
              sys.exit(f"CFBundleLocalizations mismatch: got={sorted(got)}, want={sorted(want)}")
          quotes = json.load(open("App/rest-quotes.json", encoding="utf-8"))
          assert isinstance(quotes, list) and len(quotes) > 0, "rest-quotes.json is empty"
          print(f"plist localizations ({len(got)}) & rest-quotes ({len(quotes)}) OK")
          PY

      - name: Unit tests (XCTest)
        run: swift test

      - name: Core state-machine check
        run: swift run PausaCoreCheck

      - name: Headless debug self-tests
        run: |
          swift build --product Pausa
          BIN="$(swift build --product Pausa --show-bin-path)/Pausa"
          "$BIN" --debug-selftest-prebreak
          "$BIN" --debug-quotes-selftest
          "$BIN" --debug-selftest-random-theme
          "$BIN" --debug-selftest-spacehold
          "$BIN" --debug-selftest-settings-window
          "$BIN" --debug-selftest-settings-minh "$RUNNER_TEMP/minh"

      - name: Package single-arch app & verify AppIntents metadata
        run: |
          ARCHS=arm64 VERSION=0.0.0-ci BUILD=1 App/build-app.sh
          grep -q "PausaFocusFilter" build/Pausa.app/Contents/Resources/Metadata.appintents/extract.actionsdata
          codesign --verify --deep --strict build/Pausa.app
          git diff --exit-code
